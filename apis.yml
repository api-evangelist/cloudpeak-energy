aid: cloudpeak-energy
name: Cloud Peak Energy
description: >-
  Cloud Peak Energy Inc. was an American coal mining company headquartered
  in Gillette, Wyoming, established in 2009 as a spin-off from Rio Tinto
  Energy America. The company operated three open-pit mines in the Powder
  River Basin (Wyoming and Montana) and held a 50% interest in the Decker
  Coal Company. Cloud Peak Energy filed for Chapter 11 bankruptcy in May
  2019 amid declining demand for Powder River coal in East Asian and US
  markets and is no longer operating. This profile is maintained as a
  historical record - Cloud Peak Energy did not publish public APIs.
